name: Backend validation

on:
  push:
    branches:
      - feature/ubnd-ward-school-access
    paths:
      - 'cantinso-backend/**'
      - '.github/workflows/backend-validation.yml'
  pull_request:
    branches:
      - feature/ubnd-ward-school-access
    paths:
      - 'cantinso-backend/**'
      - '.github/workflows/backend-validation.yml'

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cantinso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cantinso_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: cantinso-backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cantinso_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cantinso-backend/package-lock.json
      - run: npm install --no-audit --no-fund
      - name: Format and validate Prisma schema
        run: |
          npx prisma format
          npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply all migrations to clean PostgreSQL
        run: npx prisma migrate deploy
      - name: Import and verify Ministry of Health Appendix 7
        run: npm run prisma:seed:annex7
      - name: Validate warehouse proof and inspection rules
        run: npm run test:stock-vouchers
      - name: Validate serving-stage operations
        run: npm run test:supervision-serving
      - name: Build NestJS backend
        run: npm run build
