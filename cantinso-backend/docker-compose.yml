services:
  postgres:
    image: postgres:16-alpine
    container_name: cantinso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cantinso
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - cantinso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cantinso"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cantinso_pgdata:
